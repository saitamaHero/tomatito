name: Idea
description: Suggest something new or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: You can write in English or Spanish.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: It isn't about mobile, accounts or sync, which are out of scope for now.
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: Would you help?
      options:
        - label: I'd like to work on this myself.
